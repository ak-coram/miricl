<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LEM / miricl</title>
<style>
  :root {color-scheme:dark;font:14px/1.5 system-ui,sans-serif;color:#dedede;background:#171819}
  * {box-sizing:border-box} body {margin:0;padding:16px}
  header {display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:12px}
  h1 {font:inherit;font-weight:600;margin:0} a {color:#9fcaff}
  button {font:inherit;border:1px solid #62666a;background:#303237;color:inherit;padding:5px 12px;cursor:pointer}
  button:disabled {opacity:.5;cursor:wait} #status {margin-left:auto;color:#b5b8bd} #status.error {color:#ff9999}
  #lem-desktop {position:relative;height:calc(100vh - 146px);min-height:100px;background:#202124;overflow:hidden;border:1px solid #51545a}
  .lem-editor:focus-visible {outline:2px solid #8ab4f8;outline-offset:-2px}
  footer {font-size:12px;color:#b5b8bd;margin-top:8px}
</style>
</head>
<body>
<header><h1>LEM</h1><a href="../">miricl</a><button id="launch" disabled>Focus editor</button><button id="restart">Restart</button><span id="status" role="status" aria-live="polite">Loading LEM…</span></header>
<main id="lem-desktop" aria-label="LEM editor desktop"></main>
<footer>Development preview. Physical single-character keys and editing keys; composition, clipboard and full local Lisp IDE services are pending.</footer>
<script type="module" src="./app.mjs"></script>
</body>
</html>
