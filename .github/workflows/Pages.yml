name: Browser Examples Pages

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

# Let an active deployment finish before publishing the latest build.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build browser examples, sizes and ANSI results
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      LISP: sbcl-bin
      LIBWASMTIME_VERSION: 50.0.1
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Remove ASDF fixtures during dependency setup
        shell: bash
        run: rm -rf vendor/asdf/test

      - name: Setup Lisp
        uses: 40ants/setup-lisp@v4
        with:
          cache: true

      # The ASDF builder requires a clean upstream source checkout.
      - name: Restore ASDF source checkout
        run: git -C vendor/asdf restore --worktree -- test

      - name: Install libwasmtime
        shell: bash
        run: |
          libwasmtime_dir="$RUNNER_TEMP/wasmtime"
          mkdir -p "$libwasmtime_dir"
          curl --fail --location --retry 3 \
            "https://github.com/bytecodealliance/wasmtime/releases/download/v${LIBWASMTIME_VERSION}/wasmtime-v${LIBWASMTIME_VERSION}-x86_64-linux-c-api.tar.xz" \
            --output "$RUNNER_TEMP/wasmtime.tar.xz"
          tar -xf "$RUNNER_TEMP/wasmtime.tar.xz" -C "$libwasmtime_dir" --strip-components 2 \
            "wasmtime-v${LIBWASMTIME_VERSION}-x86_64-linux-c-api/lib/libwasmtime.so"
          echo "LD_LIBRARY_PATH=$libwasmtime_dir" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: '26'

      - uses: extractions/setup-just@v4

      - name: Install Wasmtime CLI
        shell: bash
        run: |
          curl --fail --location --retry 3 \
            "https://github.com/bytecodealliance/wasmtime/releases/download/v${LIBWASMTIME_VERSION}/wasmtime-v${LIBWASMTIME_VERSION}-x86_64-linux.tar.xz" \
            --output "$RUNNER_TEMP/wasmtime-cli.tar.xz"
          mkdir -p "$RUNNER_TEMP/wasmtime-cli"
          tar -xf "$RUNNER_TEMP/wasmtime-cli.tar.xz" -C "$RUNNER_TEMP/wasmtime-cli" --strip-components 1
          echo "$RUNNER_TEMP/wasmtime-cli" >> "$GITHUB_PATH"

      - name: Build standalone browser examples and interpreter
        shell: bash
        run: |
          ros --eval '(ql-dist:install-dist "http://dist.ultralisp.org/" :prompt nil)' --eval '(uiop:quit)'
          # --load keeps Roswell's trailing SBCL options out of the builder's argv.
          ros -L sbcl-bin run -- --load scripts/build-wasm.lisp --load scripts/build-html.lisp --load scripts/build-todo.lisp --quit
          test -s miricl.html
          test -s todo.html
          mkdir -p "$RUNNER_TEMP/pages"
          cp miricl.html "$RUNNER_TEMP/pages/index.html"
          cp todo.html "$RUNNER_TEMP/pages/todo.html"

      - name: Build FSet 2 Game of Life
        shell: bash
        run: |
          node scripts/build-asdf.mjs build/asdf miricl.wasm miricl-asdf.wasm
          ros -L sbcl-bin run -- --load "$HOME/.roswell/lisp/quicklisp/setup.lisp" --script scripts/setup-application.lisp "$PWD/game-of-life" game-of-life "$PWD" node
          just --justfile game-of-life/justfile build
          mkdir -p "$RUNNER_TEMP/pages/game-of-life"
          cp game-of-life/build/index.html game-of-life/build/miricl.js game-of-life/build/miricl.wasm game-of-life/build/game-of-life.wasm "$RUNNER_TEMP/pages/game-of-life/"

      - name: Build optimized Maxima workbench
        timeout-minutes: 15
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y sbcl build-essential
          # Compile only; algebra and browser checks run in regular CI.
          node scripts/probe-maxima.mjs miricl.wasm build/maxima/compile.json compile --build-only
          node scripts/optimize-maxima.mjs miricl.wasm build/maxima/maxima.wasm build/maxima/maxima-optimized.wasm
          node scripts/build-maxima.mjs miricl.wasm build/maxima/maxima-optimized.wasm build/maxima/site
          cp -R build/maxima/site "$RUNNER_TEMP/pages/maxima"

      - name: Build optimized FriCAS workbench
        timeout-minutes: 25
        shell: bash
        run: |
          node scripts/prepare-fricas.mjs build/fricas/native
          # Compile only; no fresh-session smoke tests in Pages.
          node scripts/probe-fricas.mjs miricl.wasm build/fricas/native build/fricas/compile.json --build-only
          node scripts/optimize-fricas.mjs miricl.wasm build/fricas/fricas.wasm build/fricas/fricas-optimized.wasm
          node scripts/build-fricas.mjs miricl.wasm build/fricas/fricas-optimized.wasm build/fricas/native build/fricas/site
          cp -R build/fricas/site "$RUNNER_TEMP/pages/fricas"

      - name: Build image size summary
        run: node scripts/build-size-html.mjs . "$RUNNER_TEMP/pages/image-sizes.html" index.html

      # Conformance runs in CI. Publish its latest recorded report separately
      # from the application build, retaining the report's own commit metadata.
      - name: Download latest saved ANSI results
        uses: actions/github-script@v7
        with:
          script: |
            const artifacts = await github.paginate(github.rest.actions.listArtifactsForRepo,
              {...context.repo, per_page: 100});
            const artifact = artifacts.find(item => !item.expired && ['ansi-results', 'ansi-full-results'].includes(item.name) && item.workflow_run?.head_branch === 'main');
            if (!artifact) throw new Error('No ANSI report artifact is available.');
            const zip = await github.rest.actions.downloadArtifact(
              {...context.repo, artifact_id: artifact.id, archive_format: 'zip'});
            require('fs').writeFileSync(process.env.RUNNER_TEMP + '/ansi-results.zip', Buffer.from(zip.data));
            core.info(`ANSI report from ${artifact.workflow_run.head_sha}`);

      - name: Copy saved ANSI results page
        shell: bash
        run: unzip -p "$RUNNER_TEMP/ansi-results.zip" ansi-results.html > "$RUNNER_TEMP/pages/ansi-results.html"

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/pages

  deploy:
    name: Deploy browser examples, sizes and ANSI results
    needs: build
    # Manual runs from other branches may build, but only main may publish.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Deploy GitHub Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4
