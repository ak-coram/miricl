name: Browser Examples Pages

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

# Build and conformance work lives in CI; Pages only publishes its static files.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Collect tested CI artifacts
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.event != 'pull_request' &&
        github.event.workflow_run.head_repository.full_name == github.repository &&
        github.event.workflow_run.conclusion == 'success'))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Select CI run for the current main commit
        id: ci
        uses: actions/github-script@v7
        with:
          script: |
            const main = await github.rest.repos.getBranch({...context.repo, branch: 'main'});
            let run = context.payload.workflow_run;
            if (!run) {
              const runs = await github.rest.actions.listWorkflowRuns({
                ...context.repo, workflow_id: 'CI.yml', branch: 'main',
                head_sha: main.data.commit.sha, status: 'success', per_page: 100});
              run = runs.data.workflow_runs.find(item =>
                item.event !== 'pull_request' && item.head_repository.full_name === context.payload.repository.full_name);
            }
            if (!run) throw new Error('No successful CI run exists for the current main commit.');
            if (run.head_sha !== main.data.commit.sha) {
              core.notice('Skipping a superseded CI run.');
              return;
            }
            core.setOutput('run-id', String(run.id));
            core.setOutput('commit', run.head_sha);
            core.info(`Publishing artifacts from CI ${run.id}, commit ${run.head_sha}`);
      - uses: actions/checkout@v4
        if: steps.ci.outputs.run-id != ''
        with:
          ref: ${{ steps.ci.outputs.commit }}
      - uses: actions/setup-node@v4
        if: steps.ci.outputs.run-id != ''
        with:
          node-version: '26'
      - uses: actions/download-artifact@v4
        if: steps.ci.outputs.run-id != ''
        with:
          name: miricl-browser-examples
          path: _site
          github-token: ${{ github.token }}
          run-id: ${{ steps.ci.outputs.run-id }}
      - uses: actions/download-artifact@v4
        if: steps.ci.outputs.run-id != ''
        with:
          name: ansi-results
          path: _ansi
          github-token: ${{ github.token }}
          run-id: ${{ steps.ci.outputs.run-id }}
      - name: Include both ANSI reports from the same commit
        if: steps.ci.outputs.run-id != ''
        run: |
          cp _ansi/ansi-results.html _ansi/ansi-compiler-results.html _site/
          cp _ansi/ansi-full-results.json _ansi/ansi-compiler-results.json _site/
      - uses: actions/download-artifact@v4
        if: steps.ci.outputs.run-id != ''
        with:
          name: compiler-statistics
          path: _compiler
          github-token: ${{ github.token }}
          run-id: ${{ steps.ci.outputs.run-id }}
      - name: Add final CI outcomes to the compiler report
        if: steps.ci.outputs.run-id != ''
        uses: actions/github-script@v7
        env:
          SOURCE_RUN_ID: ${{ steps.ci.outputs.run-id }}
        with:
          script: |
            const fs = require('node:fs');
            const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
              ...context.repo, run_id: Number(process.env.SOURCE_RUN_ID), per_page: 100});
            fs.writeFileSync('_compiler/jobs.json', JSON.stringify({jobs}));
      - name: Publish the whole-run compiler report
        if: steps.ci.outputs.run-id != ''
        run: node scripts/build-compiler-report.mjs _compiler/compiler-statistics.json _site/compiler-statistics.html _compiler/jobs.json
      - uses: actions/upload-pages-artifact@v4
        if: steps.ci.outputs.run-id != ''
        with:
          path: _site
    outputs:
      run-id: ${{ steps.ci.outputs.run-id }}

  deploy:
    name: Deploy browser examples, sizes, ANSI and compiler reports
    needs: build
    if: needs.build.outputs.run-id != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy GitHub Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4
