name: CI

on:
  push:
    branches: [main]
    paths-ignore: ['README.org']
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 0 1 * *'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  host:
    name: Host / ${{ matrix.lisp }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, lisp: sbcl-bin}
          - {os: ubuntu-latest, lisp: ccl-bin/1.13}
          - {os: ubuntu-latest, lisp: ecl/26.5.5}
          - {os: windows-latest, lisp: sbcl-bin}
          - {os: macos-latest, lisp: sbcl-bin}
    env:
      LISP: ${{ matrix.lisp }}
      # Keep Lisp sources LF, including submodules and Roswell dependencies.
      # CRLF breaks FORMAT's ~<newline> directives on Windows SBCL.
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: core.autocrlf
      GIT_CONFIG_VALUE_0: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: ./.github/actions/setup-miricl
        with:
          lisp: 'true'
          c-api: 'true'
          node: 'false'
          just: ${{ runner.os == 'Windows' && 'true' || 'false' }}
      - name: Host regressions
        if: runner.os != 'Windows'
        shell: bash
        run: |
          ros install neil-lindquist/ci-utils
          asdf-register-project
          run-fiveam -e t -l miricl/test :miricl
      - name: Host regressions (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          # Exercise each justfile's Bash shell before the Lisp script recipe.
          just
          just --justfile game-of-life/justfile
          just test-sbcl-roswell

  runtime:
    name: Build shared runtime and standalone pages
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      LISP: sbcl-bin
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: ./.github/actions/setup-miricl
        with:
          lisp: 'true'
          c-api: 'true'
      - name: Build once, reuse the cached core in the same Lisp process
        run: |
          ros -L sbcl-bin run -- --load scripts/build-wasm.lisp --load scripts/build-html.lisp --load scripts/build-todo.lisp --quit
          node scripts/build-asdf.mjs build/asdf miricl.wasm miricl-asdf.wasm
      - uses: actions/upload-artifact@v4
        with:
          name: miricl-runtime
          path: |
            miricl.js
            miricl.wasm
            miricl-precompiled.wasm
            miricl-repl.wasm
            miricl-asdf.wasm
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: runtime-pages
          path: |
            miricl.html
            todo.html
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: build-support
          path: |
            runtime/miricl.js
            runtime/version-assets.mjs
            build/asdf/asdf.lisp
          if-no-files-found: error

  integration:
    name: Integration / ${{ matrix.group }}
    needs: runtime
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        group: [runtime, compiler, asdf, browser]
    env:
      CHROMIUM: google-chrome
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: ./.github/actions/setup-miricl
        with:
          cli: 'true'
          just: 'true'
      - uses: actions/download-artifact@v4
        with:
          name: miricl-runtime
      - uses: actions/download-artifact@v4
        with:
          name: build-support
      - uses: actions/download-artifact@v4
        if: matrix.group == 'browser'
        with:
          name: runtime-pages
      # Fixed-port bridge fixtures remain sequential within each isolated runner.
      - name: Run integration group
        run: node scripts/test-integration.mjs '${{ matrix.group }}'

  applications:
    name: Application / ${{ matrix.app }}
    needs: runtime
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        app: [game-of-life, maxima, fricas]
    env:
      LISP: sbcl-bin
      CHROMIUM: google-chrome
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: ./.github/actions/setup-miricl
        with:
          lisp: ${{ matrix.app == 'game-of-life' && 'true' || 'false' }}
          native-tools: ${{ matrix.app != 'game-of-life' && 'true' || 'false' }}
          just: 'true'
      - uses: actions/download-artifact@v4
        with:
          name: miricl-runtime
      - uses: actions/download-artifact@v4
        with:
          name: build-support
      - name: Build and test Game of Life
        if: matrix.app == 'game-of-life'
        run: |
          ros -L sbcl-bin run -- --load "$HOME/.roswell/lisp/quicklisp/setup.lisp" --script scripts/setup-application.lisp "$PWD/game-of-life" game-of-life "$PWD" node
          just --justfile game-of-life/justfile build
          node tests/browser-game-of-life.mjs game-of-life/build/index.html
          node tests/browser-game-of-life.mjs game-of-life/dev.html --dev
      - name: Cache native application image and compiled algebra
        if: matrix.app != 'game-of-life'
        uses: actions/cache@v4
        id: native
        with:
          path: |
            build/${{ matrix.app }}/${{ matrix.app }}-optimized.wasm
            build/${{ matrix.app }}/optimization.json
            build/${{ matrix.app }}/retention.txt
            build/${{ matrix.app }}/algebra
          key: ${{ matrix.app }}-native-v2-${{ runner.os }}-${{ hashFiles('miricl-precompiled.wasm', '*.lisp', '*.asd', 'scripts/*.lisp', 'scripts/*.mjs', 'scripts/ports/*.lisp') }}-${{ hashFiles(format('vendor/{0}/**', matrix.app)) }}
      - name: Cache upstream FriCAS bootstrap
        if: matrix.app == 'fricas'
        uses: actions/cache@v4
        with:
          path: build/fricas/native
          key: fricas-bootstrap-v1-${{ runner.os }}-${{ hashFiles('vendor/fricas/**', 'scripts/prepare-fricas.mjs', 'scripts/fricas-files.mjs') }}
      - name: Build and test Maxima
        if: matrix.app == 'maxima'
        timeout-minutes: 35
        env:
          NATIVE_CACHE_HIT: ${{ steps.native.outputs.cache-hit }}
          MIRICL_MAXIMA_CORE: build/maxima/maxima-optimized.wasm
        run: |
          if [ "$NATIVE_CACHE_HIT" != 'true' ]; then
            node scripts/probe-maxima.mjs miricl-precompiled.wasm build/maxima/compile.json compile
            node scripts/optimize-maxima.mjs miricl-precompiled.wasm build/maxima/maxima.wasm build/maxima/maxima-optimized.wasm
          fi
          node scripts/build-maxima.mjs miricl-precompiled.wasm build/maxima/maxima-optimized.wasm build/maxima/site
          node tests/maxima.mjs miricl-precompiled.wasm build/maxima/maxima-optimized.wasm
          node scripts/probe-maxima.mjs miricl-precompiled.wasm build/maxima/core-tests.json suite rtest13s
          node tests/browser-maxima-app.mjs build/maxima/site
      - name: Build and test FriCAS
        if: matrix.app == 'fricas'
        timeout-minutes: 60
        env:
          NATIVE_CACHE_HIT: ${{ steps.native.outputs.cache-hit }}
        run: |
          node scripts/prepare-fricas.mjs build/fricas/native
          if [ "$NATIVE_CACHE_HIT" != 'true' ]; then
            node scripts/probe-fricas.mjs miricl-precompiled.wasm build/fricas/native build/fricas/compile.json --build-only
            node scripts/optimize-fricas.mjs miricl-precompiled.wasm build/fricas/fricas.wasm build/fricas/fricas-optimized.wasm
          fi
          node scripts/build-fricas.mjs miricl-precompiled.wasm build/fricas/fricas-optimized.wasm build/fricas/native build/fricas/site
          node tests/fricas.mjs miricl-precompiled.wasm
          node tests/browser-fricas-app.mjs build/fricas/site
      - uses: actions/upload-artifact@v4
        if: matrix.app == 'game-of-life'
        with:
          name: application-game-of-life
          path: |
            game-of-life/build/index.html
            game-of-life/build/miricl.js
            game-of-life/build/miricl.wasm
            game-of-life/build/game-of-life.wasm
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: matrix.app != 'game-of-life'
        with:
          name: application-${{ matrix.app }}
          path: build/${{ matrix.app }}/site/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always() && matrix.app != 'game-of-life'
        with:
          name: ${{ matrix.app }}-results
          path: |
            build/${{ matrix.app }}/compile.json
            build/${{ matrix.app }}/optimization.json
            build/${{ matrix.app }}/retention.txt
            build/${{ matrix.app }}/tests.json
            build/${{ matrix.app }}/core-tests.json
          if-no-files-found: ignore

  ansi:
    name: ANSI / ${{ matrix.mode }}
    needs: runtime
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - {mode: interpreter, report: ansi-full-results, page: ansi-results}
          - {mode: compiler, report: ansi-compiler-results, page: ansi-compiler-results}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: ./.github/actions/setup-miricl
        with:
          native-tools: 'true'
      - uses: actions/download-artifact@v4
        with:
          name: miricl-runtime
      - name: Selected ANSI tests (blocking)
        if: matrix.mode == 'interpreter'
        run: node tests/ansi.mjs miricl.wasm
      - name: Full ANSI suite
        timeout-minutes: 20
        # Both execution modes must pass the unmodified upstream suite.
        # Always render and upload diagnostics, including after a failed run.
        env:
          MIRICL_ANSI_REPORT: ${{ matrix.report }}.json
          ANSI_MODE: ${{ matrix.mode }}
        run: |
          if [ "$ANSI_MODE" = compiler ]; then
            node tests/ansi.mjs miricl.wasm --full --compiler
          else
            node tests/ansi.mjs miricl.wasm --full
          fi
      - name: Render report and require a complete passing suite
        if: always()
        run: |
          node scripts/build-ansi-html.mjs '${{ matrix.report }}.json' '${{ matrix.page }}.html'
          node scripts/check-ansi-results.mjs '${{ matrix.report }}.json'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ansi-${{ matrix.mode }}
          path: |
            ${{ matrix.report }}.json
            ${{ matrix.page }}.html
          if-no-files-found: error

  ansi-reports:
    name: Collect ANSI reports
    needs: ansi
    if: always() && !cancelled() && needs.ansi.result != 'skipped'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: ansi-*
          merge-multiple: true
          path: reports
      - name: Require both reports
        run: |
          test -s reports/ansi-full-results.json
          test -s reports/ansi-compiler-results.json
          test -s reports/ansi-results.html
          test -s reports/ansi-compiler-results.html
      - uses: actions/upload-artifact@v4
        with:
          name: ansi-results
          path: reports/
          if-no-files-found: error

  browser-examples:
    name: Assemble tested browser examples and size report
    needs: [runtime, integration, applications]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
      - uses: actions/download-artifact@v4
        with:
          name: miricl-runtime
      - uses: actions/download-artifact@v4
        with:
          name: runtime-pages
      - uses: actions/download-artifact@v4
        with:
          name: application-game-of-life
          path: game-of-life/build
      - uses: actions/download-artifact@v4
        with:
          name: application-maxima
          path: build/maxima/site
      - uses: actions/download-artifact@v4
        with:
          name: application-fricas
          path: build/fricas/site
      - name: Assemble static site and measure the actual payloads
        run: |
          mkdir -p public
          cp miricl.html public/index.html
          cp todo.html public/todo.html
          cp -R game-of-life/build public/game-of-life
          cp -R build/maxima/site public/maxima
          cp -R build/fricas/site public/fricas
          node scripts/build-size-html.mjs . public/image-sizes.html index.html
      - uses: actions/upload-artifact@v4
        with:
          name: miricl-browser-examples
          path: public/
          if-no-files-found: error
