name: CI

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - 'README.org'
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
  schedule:
    - cron: '0 0 1 * *'

jobs:
  test:
    name: ${{ matrix.lisp }} ${{ matrix.os }} libwasmtime ${{ matrix.libwasmtime }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        lisp: [sbcl-bin, ccl-bin/1.13, ecl/26.5.5]
        os: [ubuntu-latest, windows-latest, macos-latest]
        libwasmtime: [50.0.1]
        exclude:
          - os: windows-latest
            lisp: ccl-bin/1.13
          - os: windows-latest
            lisp: ecl/26.5.5
          - os: macos-latest
            lisp: ccl-bin/1.13
    env:
      LISP: ${{ matrix.lisp }}
      LIBWASMTIME_VERSION: ${{ matrix.libwasmtime }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      # These are upstream fixtures, not MIRICL's tests or dependencies.
      - name: Remove ASDF fixtures during dependency setup
        shell: bash
        run: rm -rf vendor/asdf/test

      - name: Setup Lisp
        uses: 40ants/setup-lisp@v4
        with:
          cache: true

      # The ASDF builder requires a clean upstream source checkout.
      - name: Restore ASDF source checkout
        run: git -C vendor/asdf restore --worktree -- test

      - name: Install libwasmtime (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          aria2c "https://github.com/bytecodealliance/wasmtime/releases/download/v${LIBWASMTIME_VERSION}/wasmtime-v${LIBWASMTIME_VERSION}-x86_64-linux-c-api.tar.xz"
          tar -xf wasmtime-v${LIBWASMTIME_VERSION}-x86_64-linux-c-api.tar.xz --strip-components 2 wasmtime-v${LIBWASMTIME_VERSION}-x86_64-linux-c-api/lib/libwasmtime.so

      - name: Install libwasmtime (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          aria2c "https://github.com/bytecodealliance/wasmtime/releases/download/v${LIBWASMTIME_VERSION}/wasmtime-v${LIBWASMTIME_VERSION}-aarch64-macos-c-api.tar.xz"
          tar -xf wasmtime-v${LIBWASMTIME_VERSION}-aarch64-macos-c-api.tar.xz --strip-components 2 wasmtime-v${LIBWASMTIME_VERSION}-aarch64-macos-c-api/lib/libwasmtime.dylib

      - name: Install libwasmtime (Windows)
        if: runner.os == 'Windows'
        run: |
          aria2c "https://github.com/bytecodealliance/wasmtime/releases/download/v$env:LIBWASMTIME_VERSION/wasmtime-v$env:LIBWASMTIME_VERSION-x86_64-windows-c-api.zip"
          7z e wasmtime-v$env:LIBWASMTIME_VERSION-x86_64-windows-c-api.zip ./ wasmtime-v$env:LIBWASMTIME_VERSION-x86_64-windows-c-api/lib/wasmtime.dll

      - name: Run tests (Non-Windows)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          export DYLD_LIBRARY_PATH=./
          export LD_LIBRARY_PATH=./
          ros --eval '(ql-dist:install-dist "http://dist.ultralisp.org/" :prompt nil)' --eval '(uiop:quit)'
          ros install neil-lindquist/ci-utils
          asdf-register-project
          run-fiveam -e t -l miricl/test :miricl

      - name: Run tests (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          ros install neil-lindquist/ci-utils
          asdf-register-project
          ros --eval '(ql-dist:install-dist "http://dist.ultralisp.org/" :prompt nil)' --eval '(uiop:quit)'
          ros --eval "(progn (ql:quickload :miricl/test) (uiop:quit (if (uiop:symbol-call :fiveam '#:run! :miricl) 0 1)))"

      - uses: actions/setup-node@v4
        if: runner.os == 'Linux' && matrix.lisp == 'sbcl-bin'
        with:
          node-version: '26'

      - name: Install Wasmtime CLI
        if: runner.os == 'Linux' && matrix.lisp == 'sbcl-bin'
        shell: bash
        run: |
          aria2c "https://github.com/bytecodealliance/wasmtime/releases/download/v${LIBWASMTIME_VERSION}/wasmtime-v${LIBWASMTIME_VERSION}-x86_64-linux.tar.xz"
          mkdir -p wasmtime-cli
          tar -xf wasmtime-v${LIBWASMTIME_VERSION}-x86_64-linux.tar.xz -C wasmtime-cli --strip-components 1
          echo "$PWD/wasmtime-cli" >> "$GITHUB_PATH"

      - uses: extractions/setup-just@v4
        if: runner.os == 'Linux' && matrix.lisp == 'sbcl-bin'

      - name: Standalone interpreter and REPLs
        if: runner.os == 'Linux' && matrix.lisp == 'sbcl-bin'
        shell: bash
        env:
          LD_LIBRARY_PATH: ./
        run: |
          ros -L sbcl-bin run -- --load scripts/build-wasm.lisp --quit
          node tests/threads.mjs miricl.wasm miricl-repl.wasm
          node tests/standalone.mjs miricl.wasm
          node --experimental-wasm-wasmfx tests/text-repl.mjs miricl.wasm miricl-repl.wasm
          node tests/repl-bridge.mjs miricl.wasm miricl-repl.wasm
          node tests/repl-websocket.mjs miricl.wasm miricl-repl.wasm
          node tests/dev-filesystem-server.mjs miricl.wasm miricl-repl.wasm
          node tests/backtrace.mjs miricl.wasm
          node tests/development.mjs miricl.wasm
          node tests/dev-filesystem.mjs miricl.wasm
          node scripts/build-asdf.mjs build/asdf miricl.wasm miricl-asdf.wasm
          node tests/asdf-build.mjs
          node tests/asdf.mjs miricl.wasm build/asdf/asdf.lisp
          node tests/asdf-bundle.mjs miricl.wasm build/asdf/asdf.lisp
          node tests/bundle-command.mjs miricl.wasm miricl-repl.wasm
          node tests/nested-backquote.mjs miricl.wasm
          node tests/structure-printers.mjs miricl.wasm
          node tests/readtable-iteration.mjs miricl.wasm
          node tests/whole-program.mjs miricl.wasm
          node tests/fasl-format.mjs miricl.wasm
          node tests/file-compilation.mjs miricl.wasm
          node tests/file-code-sharing.mjs miricl.wasm
          node tests/class-reachability.mjs miricl.wasm
          node tests/hash-structural.mjs miricl.wasm
          node tests/compiler-runtime.mjs
          node tests/hir.mjs miricl.wasm
          node tests/native-compilation.mjs miricl.wasm
          node tests/native-size.mjs miricl.wasm
          node tests/ansi-compiler-runner.mjs miricl.wasm
          node tests/ansi-runner.mjs miricl.wasm

      - name: Upload MIRICL distribution
        if: runner.os == 'Linux' && matrix.lisp == 'sbcl-bin'
        uses: actions/upload-artifact@v4
        with:
          name: miricl-runtime
          path: |
            miricl.js
            miricl.wasm
            miricl-repl.wasm
            miricl-asdf.wasm
          if-no-files-found: error

      - name: Build standalone browser examples
        if: runner.os == 'Linux' && matrix.lisp == 'sbcl-bin'
        shell: bash
        env:
          LD_LIBRARY_PATH: ./
        # --script treats Roswell's trailing SBCL options as script arguments.
        # --load lets SBCL consume those options before the builder reads argv.
        run: |
          ros -L sbcl-bin run -- --load scripts/build-html.lisp --load scripts/build-todo.lisp --quit
          test -s miricl.html
          test -s todo.html
          ros -L sbcl-bin run -- --load "$HOME/.roswell/lisp/quicklisp/setup.lisp" --script scripts/setup-application.lisp "$PWD/game-of-life" game-of-life "$PWD" node
          just --justfile game-of-life/justfile build

      - name: Build optimized Maxima workbench
        if: runner.os == 'Linux' && matrix.lisp == 'sbcl-bin'
        timeout-minutes: 15
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y sbcl texinfo m4
          node scripts/probe-maxima.mjs miricl.wasm build/maxima/compile.json compile
          node scripts/optimize-maxima.mjs miricl.wasm build/maxima/maxima.wasm build/maxima/maxima-optimized.wasm
          node scripts/build-maxima-docs.mjs build/maxima/doc/info
          node scripts/build-maxima.mjs miricl.wasm build/maxima/maxima-optimized.wasm build/maxima/site build/maxima/doc/info
          node scripts/build-size-html.mjs

      - name: Maxima algebra, manual examples and upstream regressions
        if: runner.os == 'Linux' && matrix.lisp == 'sbcl-bin'
        timeout-minutes: 15
        env:
          MIRICL_MAXIMA_CORE: build/maxima/maxima-optimized.wasm
        run: |
          node tests/maxima.mjs miricl.wasm build/maxima/maxima-optimized.wasm
          node scripts/probe-maxima.mjs miricl.wasm build/maxima/core-tests.json suite rtest13s
          node scripts/probe-maxima.mjs miricl.wasm build/maxima/share-tests.json share rtest_stringproc rtest_grobner rtest_distrib

      - name: Test standalone browser REPL
        if: runner.os == 'Linux' && matrix.lisp == 'sbcl-bin'
        env:
          CHROMIUM: google-chrome
        run: |
          node tests/browser-repl.mjs miricl.html
          node tests/browser-todo.mjs todo.html
          node tests/browser-game-of-life.mjs game-of-life/build/index.html
          node tests/browser-compiler.mjs
          node tests/browser-dev-repl.mjs miricl.wasm miricl-repl.wasm
          node tests/ansi-html.mjs
          node tests/size-html.mjs
          node tests/browser-maxima-app.mjs build/maxima/site

      - name: Upload standalone browser examples and size report
        if: runner.os == 'Linux' && matrix.lisp == 'sbcl-bin'
        uses: actions/upload-artifact@v4
        with:
          name: miricl-browser-examples
          path: |
            miricl.html
            todo.html
            image-sizes.html
            image-sizes.json
            game-of-life/build/index.html
            game-of-life/build/miricl.js
            game-of-life/build/miricl.wasm
            game-of-life/build/game-of-life.wasm
            build/maxima/site/
            build/maxima/optimization.json
            build/maxima/retention.txt
            build/maxima/core-tests.json
            build/maxima/share-tests.json
          if-no-files-found: error

      - name: ANSI tests in the standalone interpreter
        if: runner.os == 'Linux' && matrix.lisp == 'sbcl-bin'
        timeout-minutes: 10
        run: node tests/ansi.mjs miricl.wasm

      - name: Full ANSI conformance suite
        if: runner.os == 'Linux' && matrix.lisp == 'sbcl-bin'
        timeout-minutes: 20
        # ANSI compliance is still in progress. Keep every failure in the report;
        # the next step requires the runner to account for the entire suite.
        continue-on-error: true
        env:
          MIRICL_ANSI_REPORT: ansi-full-results.json
        run: node tests/ansi.mjs miricl.wasm --full

      - name: Full ANSI suite with self-compiled compiler
        if: runner.os == 'Linux' && matrix.lisp == 'sbcl-bin'
        timeout-minutes: 20
        continue-on-error: true
        env:
          MIRICL_ANSI_REPORT: ansi-compiler-results.json
        run: node tests/ansi.mjs miricl.wasm --full --compiler

      - name: Build standalone ANSI results page
        if: runner.os == 'Linux' && matrix.lisp == 'sbcl-bin'
        run: |
          node scripts/build-ansi-html.mjs ansi-full-results.json ansi-results.html
          node scripts/build-ansi-html.mjs ansi-compiler-results.json ansi-compiler-results.html

      - name: Check full ANSI suite completion
        if: always() && runner.os == 'Linux' && matrix.lisp == 'sbcl-bin'
        shell: bash
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          for (const file of ['ansi-full-results.json', 'ansi-compiler-results.json']) {
            const report = JSON.parse(fs.readFileSync(file, 'utf8'));
            const s = report.summary;
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,
              `### Full ANSI suite (${report.execution})\n\n${s.passed} passed, ${s.failed} failed, ${s.blocked} blocked, ${s.timedOut} timed out; ${s.total}/${s.expected} tests accounted for, ${s.loadErrors} load errors.\n`);
            assert.equal(report.error, null, report.error);
            assert.equal(s.complete, true, 'Full ANSI suite did not finish');
            assert.ok(s.total > 0);
            assert.equal(s.total, s.expected);
            if (report.execution === 'compiler') {
              assert.equal(report.compilerBootstrap?.mode, 'self-compiled',
                'The ANSI compiler was not bootstrapped with itself');
              assert.equal(report.compilerBootstrap.origin, 'first-use');
              assert.ok(report.compilerBootstrap.functions >= 93);
              assert.ok(report.tests.filter(test => test.passed).every(test => test.compilation?.compiled > 0),
                'A compiler test passed without native compilation');
            }
          }
          JS

      - name: Upload ANSI results
        if: always() && runner.os == 'Linux' && matrix.lisp == 'sbcl-bin'
        uses: actions/upload-artifact@v4
        with:
          name: ansi-results
          path: |
            ansi-results.json
            ansi-full-results.json
            ansi-results.html
            ansi-compiler-results.json
            ansi-compiler-results.html
          if-no-files-found: ignore
